# ArgoCD Application CRD — the heart of GitOps
# This tells ArgoCD: "Watch THIS repo, sync THIS path, deploy to THIS namespace"
#
# Pipeline does NOT deploy the app. This CRD makes ArgoCD do it.
# configure-argocd.sh replaces ACR_LOGIN_SERVER_PLACEHOLDER before applying.
#
# Interview: "The Application CRD points ArgoCD at a Git repo path containing
#             a Helm chart. ArgoCD watches for changes, and auto-sync means
#             any git push triggers a deployment. Self-heal reverts manual
#             kubectl changes. Prune deletes resources removed from Git."

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-platform-dev
  namespace: argocd          # Applications MUST live in argocd namespace
spec:
  project: atlas-project     # RBAC boundary — which repos/clusters allowed
  source:
    repoURL: https://github.com/manoj-2606/atlas-07-ArgoCD-GitOps.git
    targetRevision: main     # Branch to watch
    path: charts/atlas-platform    # Path to Helm chart in repo
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.repository
          value: ACR_LOGIN_SERVER_PLACEHOLDER/atlas-platform-app
        - name: image.tag
          value: "latest"    # Replaced by configure-argocd.sh with Build.BuildId
  destination:
    server: https://kubernetes.default.svc    # In-cluster
    namespace: dev
  syncPolicy:
    automated:
      prune: true            # Delete resources removed from Git
      selfHeal: true         # Revert manual cluster changes
    syncOptions:
      - CreateNamespace=true # Create dev namespace if missing